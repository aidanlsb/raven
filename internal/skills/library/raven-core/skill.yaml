id: raven-core
title: Raven Core
version: 3
summary: Core Raven workflows for creating, reading, editing, and organizing content safely.
entry: body.md
references:
  - references/command-map.md
coverage:
  commands:
    - new
    - upsert
    - add
    - read
    - resolve
    - schema
    - set
    - update
    - edit
    - reclassify
    - move
    - section create
    - section delete
    - section move
    - section rename
    - delete
    - backlinks
    - check
    - daily
    - date
    - open
    - docs
    - docs fetch
    - docs search
execution:
  preferred_transport: cli
  cli_binary: rvn
  cli_args_suffix:
    - --json
  mcp_fallback: true
