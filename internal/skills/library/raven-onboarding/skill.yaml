id: raven-onboarding
title: Raven Onboarding
version: 1
summary: Intent-first onboarding that detects vault state, creates the first vault when none exists, then designs a small personalized schema from the user's real goals and seeds it with their own content.
entry: body.md
references:
  - references/onboarding-playbook.md
coverage:
  commands:
    - init
    - vault
    - vault add
    - vault list
    - vault stats
    - vault use
    - vault pin
    - vault config show
    - config
    - config show
    - config set
    - lsp
    - schema
    - schema add type
    - schema add field
    - schema add trait
    - schema validate
    - new
    - add
    - set
    - read
    - resolve
    - query
    - search
    - backlinks
    - outlinks
    - daily
    - date
    - check
    - reindex
execution:
  preferred_transport: cli
  cli_binary: rvn
  cli_args_suffix:
    - --json
  mcp_fallback: true
