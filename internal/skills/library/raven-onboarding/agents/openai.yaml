name: raven-onboarding
description: Guided first-session onboarding that detects vault state, creates the first vault when none exists, then teaches Raven concepts.
default_prompt: Walk the user through Raven using CLI (`rvn`) commands with --json. First detect vault state with `rvn vault list`; if there is no vault yet, help create the first one with `rvn init` and honor its post_init output before teaching create, query, and check.
