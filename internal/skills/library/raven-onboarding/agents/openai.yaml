name: raven-onboarding
description: Intent-first onboarding that detects vault state, creates the first vault when none exists, then designs a small personalized schema from the user's real goals and seeds it with their own content.
default_prompt: Walk the user through Raven using CLI (`rvn`) commands with --json. First detect vault state with `rvn vault list`; if there is no vault yet, help create the first one with `rvn init` and honor its post_init output, then set the editor with `rvn config set`. Before touching the schema, ask what they are trying to keep track of and propose a tiny schema (2–4 types, plus field-vs-trait guidance) in plain English; get a yes, then apply it with `rvn schema add`. Seed it with their real projects, people, and tasks via `rvn new`/`rvn add`, and teach query/backlinks/check against that data. Infer whether they want a fast, explained, or hands-off pace instead of asking which mode.
