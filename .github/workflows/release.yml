name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# GITHUB_TOKEN is limited to creating/updating the GitHub Release on the
# release job only. Homebrew formula updates use HOMEBREW_TAP_TOKEN, a
# dedicated PAT that should be scoped to aidanlsb/homebrew-tap only and is
# passed only to the GoReleaser step.
#
# Do not add `environment:` here yet. After Aidan creates a GitHub Environment
# (suggested name: `release`) and moves HOMEBREW_TAP_TOKEN onto it, the
# release job should set `environment: release` so environment protection
# rules gate publishing. See RELEASING.md.
permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag="${TAG}"
          git fetch origin main --quiet
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag"
            echo "Expected semver tag like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          # On tag-push events, actions/checkout may rewrite local refs/tags/<tag>
          # to the target commit SHA. Validate annotation status from remote refs.
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}^{}" >/dev/null 2>&1; then
            echo "Release tags must be annotated tags (git tag -a)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Release tags must point to a commit that is already on origin/main."
            exit 1
          fi

      - name: Validate changelog entry
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag="${TAG}"
          if ! grep -Eq "^## \[${tag}\]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing a section for ${tag}."
            echo "Add a heading like: ## [${tag}] - YYYY-MM-DD"
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.9.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  verify-release:
    name: Verify release assets
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Download and verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          cd "${workdir}"

          gh release download "${TAG}"
          sha256sum --strict -c checksums.txt

          version="${TAG#v}"
          archive="raven_${version}_linux_x86_64.tar.gz"
          if [[ ! -f "${archive}" ]]; then
            echo "Missing expected linux/amd64 archive: ${archive}"
            exit 1
          fi

          mkdir extracted
          tar -xzf "${archive}" -C extracted
          bin="$(find extracted -type f -name rvn -print -quit)"
          if [[ -z "${bin}" ]]; then
            echo "rvn binary not found in ${archive}"
            exit 1
          fi
          chmod +x "${bin}"

          # The CLI exposes `rvn version` (not --version; -v is --vault).
          got="$("${bin}" version)"
          printf '%s\n' "${got}"
          first_line="${got%%$'\n'*}"
          expected="rvn ${TAG}"
          if [[ "${first_line}" != "${expected}" ]]; then
            echo "version mismatch: got '${first_line}', want '${expected}'"
            exit 1
          fi
