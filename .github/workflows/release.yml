name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          git fetch origin main --quiet
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag"
            echo "Expected semver tag like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          # On tag-push events, actions/checkout may rewrite local refs/tags/<tag>
          # to the target commit SHA. Validate annotation status from remote refs.
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}^{}" >/dev/null 2>&1; then
            echo "Release tags must be annotated tags (git tag -a)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Release tags must point to a commit that is already on origin/main."
            exit 1
          fi

      - name: Validate changelog entry
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! grep -Eq "^## \[${tag}\]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing a section for ${tag}."
            echo "Add a heading like: ## [${tag}] - YYYY-MM-DD"
            exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.9.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
